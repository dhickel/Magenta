<div id="skills-detail" class="orch-panel skills-detail skill-guide-panel"><div class="skill-detail-header"><div><h2>Guided Skill Creation</h2><p>Create a valid root-repository skill scaffold.</p></div></div><form class="form skill-guide-form" hx-post="/skills/_create" hx-target="#skills-detail" hx-swap="outerHTML"><label><span>Skill name</span><input type="text" name="skillName" class="form-input" placeholder="data-cleanup" value pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="64" required /></label><label><span>When to use</span><textarea name="description" class="form-textarea" rows="4" maxlength="1024" placeholder="Use when..." required></textarea></label><label><span>Workflow instructions</span><textarea name="instructions" class="form-textarea" rows="10" placeholder="1. Inspect the input...
2. Apply the workflow..." required></textarea></label><label class="skill-checkbox-row"><input type="checkbox" name="createReferences" value="true" /><span>Create references/</span></label><div class="skill-guide-subgrid"><label><span>Reference file name</span><input type="text" name="referenceFileName" class="form-input" placeholder="REFERENCE.md" value /></label><label><span>Reference file content</span><textarea name="referenceContent" class="form-textarea" rows="4" placeholder="Optional starter content"></textarea></label></div><label class="skill-checkbox-row"><input type="checkbox" name="createScripts" value="true" /><span>Create scripts/</span></label><div class="skill-guide-subgrid"><label><span>Script note file name</span><input type="text" name="scriptFileName" class="form-input" placeholder="README.md" value /></label><label><span>Script note file content</span><textarea name="scriptContent" class="form-textarea" rows="4" placeholder="Optional starter content"></textarea></label></div><label class="skill-checkbox-row"><input type="checkbox" name="createAssets" value="true" /><span>Create assets/</span></label><div class="skill-guide-subgrid"><label><span>Asset note file name</span><input type="text" name="assetFileName" class="form-input" placeholder="README.md" value /></label><label><span>Asset note file content</span><textarea name="assetContent" class="form-textarea" rows="4" placeholder="Optional starter content"></textarea></label></div><button type="submit" class="btn btn-primary orch-primary">Create Skill</button></form></div>
