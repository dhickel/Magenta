instance:
  workspaceRoot: "/home/hickelpickle/Code/Java/Magenta2/agent-sandbox"
  dataRoot: ".magenta"
  debugJsonl: ".magenta/logs/events.jsonl"
  localDevMode: true
  maxTurns: 8
  maxToolOutputBytes: 32768
  maxFileReadLines: 200
  maxSqlRows: 500
  maxEssenceBodyBytes: 65536

security:
  mode: "BLACKLIST"
  devYoloOverride: false
  allowedPaths:
    - "."
  allowedCommands: []
  allowedTools: []
  deniedTools: []
  webAccess:
    localEnabled: false
    externalEnabled: false
  rules:
    - id: allow-read-rg
      action: allow
      commandPrefix: ["rg"]
    - id: prompt-shell-git
      action: prompt
      commandPrefix: ["git"]
    - id: deny-destructive
      action: deny
      commandPrefix: ["rm", "-rf"]
      reason: "Use safe deletion workflow"

terminal:
  rendering:
    colorEnabled: true
    showTimestamps: false
    showStatusBar: true
    colors:
      system: "magenta"
      user: "cyan"
      assistant: "green"
      info: "cyan"
      warn: "yellow"
      error: "red"
      muted: "bright"
      default: "default"
  security:
    eventVisibility: "denials_only"
  tools:
    outputFormat: "compact_summary"

models:
  include:
    - "models/*.yaml"

prompts:
  include:
    - "prompts/**/*.md"

tasks:
  include:
    - "tasks/*.yaml"

workflows:
  include:
    - "workflows/*.yaml"

agents:
  include:
    - "agents/*.yaml"
