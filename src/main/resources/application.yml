server:
  port: 8080

app:
  ai:
    config-path: ./config/ai-config.example.json

magenta:
  features:
    schedules-enabled: false
    reactions-enabled: false
  plan:
    execution-stream-timeout-seconds: 0
  ai:
    openai-compatible-read-timeout-seconds: 360
  docker:
    # Enabled by default for alpha runtime validation against Podman/Docker.
    enabled: true
    # host: unix:///run/user/1000/podman/podman.sock
    # DOCKER_HOST env var takes precedence over host property.
    # Default detection order: $DOCKER_HOST, property, $XDG_RUNTIME_DIR/podman/podman.sock,
    #   /run/user/$UID/podman/podman.sock, /var/run/docker.sock
    agent-image: python:3.11
    exec-timeout-seconds: 600
    agent-idle-ttl-seconds: 1800
    keep-containers-on-shutdown: false
    selinux-relabel: true

spring:
  web:
    resources:
      chain:
        enabled: true
  datasource:
    url: jdbc:sqlite:./chat-memory.db?foreign_keys=true
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  ai:
    ollama:
      base-url: http://192.168.1.112:11434
      chat:
        options:
          model: qwen3.6:35b
