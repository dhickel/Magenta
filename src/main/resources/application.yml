server:
  port: 8080

app:
  ai:
    config-path: ./config/ai-config.example.json

spring:
  datasource:
    url: jdbc:sqlite:./chat-memory.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    ollama:
      base-url: http://192.168.1.112:11434
      chat:
        options:
          model: qwen3.6-35b-a3b-text-ctx32k
